<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Gilmore Dasmariñas — Shopify &amp; WordPress Website Operations Specialist</title>
    <meta
      name="description"
      content="Senior Shopify &amp; WordPress website operations specialist with 14+ years' experience in technical SEO, Core Web Vitals and ecommerce operations at 10,000+ product scale."
    />
    <meta name="author" content="Gilmore Jason S. Dasmariñas" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0d6b58" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c0f" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://ploy2x.github.io/gilmore-portfolio/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Security: browser-honored meta. Real headers belong at the edge. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Fonts: preconnect before the stylesheet so the handshake overlaps parsing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Gilmore Dasmariñas — Portfolio" />
    <meta property="og:url" content="https://ploy2x.github.io/gilmore-portfolio/" />
    <meta
      property="og:title"
      content="Gilmore Dasmariñas — Shopify &amp; WordPress Website Operations Specialist"
    />
    <meta
      property="og:description"
      content="14+ years operating ecommerce websites. Technical SEO, Core Web Vitals and Shopify operations at 10,000+ product scale."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Gilmore Dasmariñas — Shopify &amp; WordPress Website Operations Specialist"
    />
    <meta
      name="twitter:description"
      content="14+ years operating ecommerce websites. Technical SEO, Core Web Vitals and Shopify operations at 10,000+ product scale."
    />

    <!-- Structured data: Person + WebSite + FAQ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://ploy2x.github.io/gilmore-portfolio/#gilmore",
            "name": "Gilmore Jason S. Dasmariñas",
            "alternateName": "Gilmore Dasmariñas",
            "url": "https://ploy2x.github.io/gilmore-portfolio/",
            "jobTitle": "Shopify & WordPress Website Operations Specialist",
            "description": "Senior Shopify and WordPress operations specialist with 14+ years of experience in technical SEO, Core Web Vitals optimization and ecommerce website operations.",
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "PH"
            },
            "knowsAbout": [
              "Shopify",
              "Shopify 2.0",
              "Shopify Markets",
              "WordPress",
              "Technical SEO",
              "Core Web Vitals",
              "Ecommerce Operations",
              "Liquid",
              "Conversion Rate Optimization",
              "Website Migration"
            ],
            "knowsLanguage": ["en"],
            "seeks": {
              "@type": "Demand",
              "name": "Full-time remote website operations, Shopify development and technical SEO roles"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://ploy2x.github.io/gilmore-portfolio/#website",
            "url": "https://ploy2x.github.io/gilmore-portfolio/",
            "name": "Gilmore Dasmariñas — Portfolio",
            "publisher": { "@id": "https://ploy2x.github.io/gilmore-portfolio/#gilmore" },
            "inLanguage": "en-US"
          },
          {
            "@type": "FAQPage",
            "@id": "https://ploy2x.github.io/gilmore-portfolio/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Can you work independently?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. I own the roadmap, prioritize by business impact, and ship without hand-holding."
                }
              },
              {
                "@type": "Question",
                "name": "Can you work with existing developers?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. I integrate into existing dev teams, respect their conventions, and coordinate through Git, Linear, Jira, or whatever you use."
                }
              },
              {
                "@type": "Question",
                "name": "Can you improve an existing Shopify store?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Most of my work is inheriting live stores and steadily improving performance, SEO, and merchandising without breaking anything."
                }
              },
              {
                "@type": "Question",
                "name": "Can you handle SEO?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Technical SEO, Core Web Vitals, schema, redirects, product SEO at 10,000+ SKU scale, GSC and GA4 analysis."
                }
              },
              {
                "@type": "Question",
                "name": "Can you migrate a Shopify 1.0 theme to 2.0?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. I've migrated multiple stores from Shopify 1.0 to 2.0 — sections, metaobjects, and clean theme architecture included."
                }
              },
              {
                "@type": "Question",
                "name": "Can you work during our timezone?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. I'm based in the Philippines (GMT+8) and flexible with overlap for US, EU, AU teams."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Apply the saved theme before first paint: no flash of the wrong palette.
         Light is the default; dark is the visitor's explicit, persisted choice. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('gjd-theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
